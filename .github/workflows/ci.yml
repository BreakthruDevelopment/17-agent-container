name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# GitHub's default run shell is `bash -e {0}`, which takes a pipeline's status from its LAST command. Without
# pipefail, `agent-container demo | tee smoke.out` reports tee's status and a CLI that prints the expected lines
# and then exits non-zero goes green. This check is what every merge in the track keys off, and slice 17.6
# replaces the stub with a loop that can fail after emitting output, so the pipeline status has to be the real one.
defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The name is load-bearing: the merge rules and the review gate key off it.
    name: Lint, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No AWS access: this repo's CI runs on recorded replies and never reads the Bedrock secrets.
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict
      - run: uv run pytest
      - name: Build the package
        run: |
          uv build
          uv venv --python 3.12 /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          # -P: without it `python -c` puts the checkout root on sys.path and this imports the
          # SOURCE tree, so it passes whatever the wheel contains. Measured: a gutted wheel passed.
          /tmp/wheel-check/bin/python -P -c "import agent_container, agent_container.core"
      - name: Smoke test (CLI on recorded replies)
        run: |
          # Data on stdout (JSON-lines events), prose on stderr. The exit code is the CLI's own verdict.
          /tmp/wheel-check/bin/agent-container demo > smoke.events 2> smoke.out
          cat smoke.out
          # Anchored: the summary now includes the model's final answer (indented), and an
          # unanchored match would let model text forge any of these three.
          grep -qE "^turn [0-9]+: stop_reason=end_turn$" smoke.out
          grep -qE "^staged_changes=1$" smoke.out
          grep -qE "^demo ok" smoke.out
          # Every stdout line parses and the events are really there: a dead event bus fails here.
          /tmp/wheel-check/bin/python -P -c "from agent_container.demo import validate_event_stream; validate_event_stream(open('smoke.events').read())"

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: agent-container:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the demo in the image
        run: docker run --rm agent-container:ci demo 2>&1 >/dev/null | grep -qE "^demo ok"
