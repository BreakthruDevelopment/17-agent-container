[project]
name = "agent_container"
version = "0.1.0"
description = "A reusable agent core: loop, model providers, tool contracts, permission gate, budget."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35,<2",
    "pydantic>=2.9,<3",
    "pyyaml>=6.0.1,<7",
]

[project.scripts]
agent-container = "agent_container.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_container"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# pytest asserts are the point of a test file.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["agent_container", "tests"]
warn_unreachable = true

# boto3 and botocore ship no type information; `bedrock.py` is the only importer and wraps the client
# in the typed `ConverseClient` protocol straight away.
[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.*"]
ignore_missing_imports = true

# PyYAML ships no type information; `builder.py` calls `yaml.safe_load` and catches `YAMLError`.
[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# A hung test fails after 60 s instead of stalling the run (no test here legitimately takes that long).
timeout = 60
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
